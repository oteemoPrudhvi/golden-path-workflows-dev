# One ExternalSecret per secret, deliberately not one combined object. The
# values are set out of band by whoever owns each integration (issue #2 Okta,
# #3 GitHub, #4 backend). A combined object would fail to sync until ALL of
# them were set; separate objects let each become usable as soon as its own
# value exists. Until then that one ExternalSecret reports SecretSyncError,
# which is expected rather than a fault.
#
# Each Secret has a single key whose name is the environment variable Backstage
# reads, so a Deployment can use it directly:
#   envFrom / secretKeyRef -> name: backstage-okta, key: AUTH_OKTA_CLIENT_SECRET
{{- range $s := .Values.appSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.secretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $s.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $s.envVar }}
      remoteRef:
        key: {{ $s.remoteKey | quote }}
{{- end }}
