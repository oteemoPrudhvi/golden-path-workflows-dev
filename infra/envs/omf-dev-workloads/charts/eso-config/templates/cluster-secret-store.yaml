# Tells External Secrets where to look. Authenticates with the operator's own
# IRSA service account — no static credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.operatorServiceAccount.name }}
            namespace: {{ .Values.operatorServiceAccount.namespace }}
