# Projects the database credentials into a Kubernetes Secret the Backstage pod
# consumes as POSTGRES_* environment variables. The values never appear in a
# manifest, in Terraform state, or in a plan.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-database
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: backstage-database
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.databaseSecretKey | quote }}
