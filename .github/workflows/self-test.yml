# Proves the skeleton still renders and passes its own pipeline checks, so a
# broken skeleton is caught here and not in the first run of a generated repo.
name: Self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Render the skeleton
        run: |
          python -I scripts/render.py --package-name demo-pkg \
            --description 'Self-test package' --owner group:default/team-a \
            --python-version 3.12 --out "$RUNNER_TEMP/demo-pkg"
      - name: Run the pipeline checks on it
        working-directory: ${{ runner.temp }}/demo-pkg
        run: |
          pip install -e ".[dev]" build twine
          ruff check .
          ruff format --check .
          mypy src
          pytest --cov --cov-fail-under=80
          python -m build
          twine check dist/*
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - run: ./actionlint
